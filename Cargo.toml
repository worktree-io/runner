[package]
name = "worktree-io"
version = "0.18.0"
edition = "2021"
description = "A CLI tool to open GitHub issues as git worktree workspaces"
license = "MIT"
repository = "https://github.com/worktree-io/runner"
keywords = ["worktree", "github", "issues", "cli", "git"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "worktree_io"
path = "src/lib.rs"

[[bin]]
name = "worktree"
path = "src/main.rs"

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
insta       = "1"
tempfile    = "3"

[dependencies]
clap             = { version = "4", features = ["derive"] }
serde            = { version = "1", features = ["derive"] }
toml             = "1"
anyhow           = "1"
url              = "2"
dirs             = "6"
uuid             = { version = "1", features = ["v4"] }
petname          = "3"
humantime        = "2"
humantime-serde  = "1"
which = "8.0.2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Cannot control transitive dependency version conflicts
multiple_crate_versions = "allow"
# Forbid leftover `dbg!` debugging macros from reaching production
dbg_macro = "deny"
# Forbid leftover `todo!` placeholders from reaching production
todo = "deny"
# Forbid explicit `panic!` calls; unreachable arms belong in `unreachable!`
panic = "deny"
# Forbid `.expect()`: it aborts the process on an unexpected value instead of
# surfacing a recoverable error. Call sites that print a stack trace by design
# (invariants the caller already checked, intentionally documented panics)
# carry a localized `#[allow]`; everywhere else propagate via `anyhow::Result`.
expect_used = "deny"
# Prevent panic!() inside Result/Option-returning functions; failures must be
# returned as Err(_)/None so callers can handle them rather than crashing.
panic_in_result_fn = "deny"
# Require every `#[allow(...)]` / `#![allow(...)]` attribute to carry a
# `reason = "..."` string explaining WHY the lint is suppressed. Without a
# reason, a suppression is opaque: a future reader can't tell whether the
# `allow` is a deliberate policy decision, a temporary workaround, or an
# accidental copy-paste. Documenting the reason turns each suppression into
# self-explanatory code and makes it easy to re-evaluate or remove them as
# the codebase evolves.
allow_attributes_without_reason = "deny"
